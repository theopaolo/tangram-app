# Sveltia CMS configuration.
# Git-based: edits are committed to the GitHub repo; Vercel rebuilds to publish.
#
# AUTH (Vercel): the GitHub backend needs an OAuth handler. Deploy the Sveltia
# OAuth helper (https://github.com/sveltia/sveltia-cms-auth) — to Cloudflare
# Workers or as a serverless function — register a GitHub OAuth App, then point
# `base_url` (+ optional `auth_endpoint`) below at it. See the repo's README.

backend:
  name: github
  repo: theopaolo/tangram-app
  branch: main
  # base_url: https://your-oauth-handler.example.workers.dev

# Uploaded images go next to the existing artwork images.
media_folder: static/images
public_folder: /images

locale: fr

collections:
  # ---- Chromogramme sets: each = a full collection of 7 artworks ----
  - name: chromograms
    label: Chromogrammes
    label_singular: Chromogramme
    folder: content/chromograms
    format: json
    extension: json
    identifier_field: id
    create: true
    slug: '{{fields.id}}'
    summary: '{{name}} ({{id}})'
    fields:
      - { name: id, label: 'ID (slug, ex: chromogram-2)', widget: string }
      - { name: name, label: 'Nom (interne)', widget: string }
      - { name: title, label: "Titre (page d'accueil)", widget: string, required: false, hint: 'Ex : CHROMOGRAM #1' }
      - { name: intro, label: "Texte d'introduction", widget: text, required: false, hint: 'Sépare les paragraphes par une ligne vide.' }
      - name: puzzles
        label: Puzzles disponibles
        widget: relation
        collection: puzzles
        value_field: id
        search_fields: [name, id]
        display_fields: [id, name]
        multiple: true
        required: false
        hint: >
          Sélectionne les puzzles proposés pour ce chromogramme (dans l'ordre
          d'affichage). Laisser vide = tous les puzzles.
      - name: pieces
        label: Pièces (7)
        label_singular: Pièce
        widget: list
        min: 7
        max: 7
        summary: '#{{fields.pieceId}} — {{fields.titre_artwork}}'
        fields:
          - { name: pieceId, label: 'N° pièce (1–7)', widget: number, value_type: int, min: 1, max: 7 }
          - { name: color, label: Couleur, widget: color, enableAlpha: false }
          - { name: color_name, label: Nom de la couleur, widget: string }
          - { name: rvb, label: RVB, widget: string }
          - { name: cmjn, label: CMJN, widget: string }
          - { name: titre_artwork, label: Titre de l'œuvre, widget: string }
          - { name: artiste, label: Artiste, widget: string }
          - { name: date, label: Date, widget: string }
          - { name: story, label: Texte, widget: text }
          - { name: dapres_toi, label: 'Question « D''après toi »', widget: string }
          - name: dapres
            label: Réponses
            widget: list
            field: { name: reponse, label: Réponse, widget: string }
          - name: images
            label: Images
            widget: list
            fields:
              - { name: src, label: Image, widget: image }
              - { name: credits, label: Crédits, widget: string, required: false }

  # ---- Puzzles: global, reused across all sets (geometry from the editor) ----
  - name: puzzles
    label: Puzzles
    label_singular: Puzzle
    folder: content/puzzles
    format: json
    extension: json
    identifier_field: name
    create: true
    slug: '{{fields.id}}'
    summary: '#{{id}} — {{name}}'
    fields:
      - { name: id, label: ID, widget: number, value_type: int }
      - { name: name, label: Nom, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - { name: completed, label: Terminé (défaut), widget: boolean, default: false, required: false }
      - { name: scale, label: Échelle, widget: number, value_type: float, required: false }
      - name: layout
        label: Disposition (JSON)
        widget: text
        hint: >
          Ouvre l'éditeur, place les 7 pièces, clique **Export**, puis colle ici
          le JSON copié (l'objet complet avec `container` et `pieces`).
          Éditeur : http://localhost:5180/editor (en production : /editor)
